<!doctype html>
<html lang="en"><meta charset="utf-8">
<title>FounderNotes internal gate performance draft</title>
<style>html,body{margin:0;background:#e9e5d9;width:100%;height:100%;overflow:hidden}canvas{width:100%;height:100%;display:block}</style>
<canvas id="stage" width="1920" height="1080" aria-label="Original whole-body stick-character gate exercise"></canvas>
<script>
// @INLINE_GEOMETRY@
const canvas=document.getElementById('stage'), c=canvas.getContext('2d');
const INK='#354c51';
function path(points,width=16,color=INK){
 c.beginPath();c.moveTo(...points[0]);for(const p of points.slice(1))c.lineTo(...p);
 c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.lineJoin='round';c.stroke();
}
function draw(t){
 const g=geometryAt(t),p=g.pose;
 c.setTransform(1,0,0,1,0,0);c.fillStyle='#e9e5d9';c.fillRect(0,0,1920,1080);
 c.fillStyle='#d7d3c5';c.fillRect(0,830,1920,250);
 path([[80,830],[1820,830]],3,'#b3b5a6');
 // Low steps ascend toward the left. The final pose lands on the first two treads.
 c.fillStyle='#a7b7ab';c.fillRect(320,770,70,60);c.fillRect(390,800,70,30);
 c.fillStyle='#bdc7b8';c.fillRect(250,740,70,90);
 c.fillStyle='#c3bba9';c.fillRect(758,145,260,685);
 c.fillStyle='#40565a';c.fillRect(777,170,222,660);
 for(let x=790;x<998;x+=35)path([[x+g.gateOffset,205],[x+g.gateOffset,826]],9,'#91a29a');
 path([[777+g.gateOffset,530],[999+g.gateOffset,530]],14,'#b5ae92');
 c.fillStyle='#b78c4b';c.fillRect(874+g.gateOffset,514,43,46);
 // Open shackle is never drawn: the obstacle remains physically closed.
 c.strokeStyle='#b78c4b';c.lineWidth=10;c.beginPath();c.arc(895+g.gateOffset,514,12,Math.PI,0);c.stroke();
 for(const foot of p.feet){const floor=foot[0]>=320&&foot[0]<390?770:foot[0]>=390&&foot[0]<460?800:830;if(Math.abs(foot[1]-floor)<3){c.fillStyle='#b9b9a9';c.beginPath();c.ellipse(foot[0]+7,floor+3,35,6,0,0,Math.PI*2);c.fill();}}
 // Far limbs are drawn before the spine and near limbs.
 path([g.legs[0].shoulder,g.legs[0].elbow,g.legs[0].wrist],14,'#607270');
 path([g.arms[0].shoulder,g.arms[0].elbow,g.arms[0].wrist],14,'#607270');
 c.beginPath();c.moveTo(...p.hip);c.quadraticCurveTo(...g.spineControl,...p.chest);c.strokeStyle=INK;c.lineWidth=19;c.lineCap='round';c.stroke();
 path(g.shoulders,13);
 path([p.chest,[p.head[0],p.head[1]+28]],13);
 path([g.legs[1].shoulder,g.legs[1].elbow,g.legs[1].wrist]);
 path([g.arms[1].shoulder,g.arms[1].elbow,g.arms[1].wrist]);
 for(const limb of g.legs)path([limb.wrist,[limb.wrist[0]+19,limb.wrist[1]]],12);
 c.fillStyle='#f5efdf';c.strokeStyle=INK;c.lineWidth=11;c.beginPath();c.arc(...p.head,31,0,Math.PI*2);c.fill();c.stroke();
 for(const a of g.arms){c.fillStyle='#d3aa64';c.beginPath();c.arc(...a.wrist,7,0,Math.PI*2);c.fill();}
 // No captions or dialogue are fabricated for this internal movement exercise.
}
window.MOTION={width:1920,height:1080,fps:30,duration:DURATION};
window.seek=window.renderAt=async(t)=>draw(t);
window.OPENER={seekFrame:window.renderAt,ready:true};
window.seek(0);
</script></html>
