<!doctype html>
<html lang="en"><meta charset="utf-8">
<title>FounderNotes internal gate performance draft</title>
<style>html,body{margin:0;background:#e9e5d9;width:100%;height:100%;overflow:hidden}canvas{width:100%;height:100%;display:block}</style>
<canvas id="stage" width="1920" height="1080" aria-label="Original whole-body stick-character gate exercise"></canvas>
<script>
// @INLINE_GEOMETRY@
const canvas=document.getElementById('stage'), c=canvas.getContext('2d');
const INK='#354c51';
function path(points,width=8,color=INK){
 c.beginPath();c.moveTo(...points[0]);for(const p of points.slice(1))c.lineTo(...p);
 c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.lineJoin='round';c.stroke();
}
// Minimal original face: two eyes, two brow strokes, one mouth. Features slide toward the facing side.
function drawFace(p,head,f){
 const s=HEAD_R/31;c.save();c.translate(...head);c.scale(s,s);c.translate(-head[0],-head[1]);
 // Features turn decisively toward where the head points, so travel and attention direction read.
 const facing=Math.max(-1,Math.min(1,(p.head[0]-p.chest[0])/18));
 const [hx,hy]=[head[0]+facing*13,head[1]];
 c.strokeStyle=INK;c.fillStyle=INK;c.lineWidth=3.5;c.lineCap='round';
 for(const side of [-1,1]){
  const ex=hx+side*9, ey=hy-4;
  if(f.eye<.12){c.beginPath();c.arc(ex,ey-2,4,.15*Math.PI,.85*Math.PI);c.stroke();}
  else{c.beginPath();c.ellipse(ex,ey,3.2,4.6*Math.min(f.eye,1.3),0,0,Math.PI*2);c.fill();}
  // Inner brow end (toward the nose) drops when angry, rises when worried.
  const by=ey-11-f.lift*5, inner=ex-side*5, outer=ex+side*5;
  c.beginPath();c.moveTo(outer,by-f.brow*1.5);c.lineTo(inner,by+f.brow*3.5);c.stroke();
 }
 const my=hy+12;
 // Effort (angry brows) opens wide and flat with a teeth line; shock opens round.
 const grit=Math.max(0,Math.min(1,(f.brow-.5)*2));
 if(f.open>.05){const w=5.5+grit*5,hgt=(1.5+f.open*5)*(1-.45*grit);
  c.beginPath();c.ellipse(hx,my+1,w,hgt,0,0,Math.PI*2);c.fill();
  if(grit>.3){c.strokeStyle='#f5efdf';c.lineWidth=1.5;c.beginPath();c.moveTo(hx-w+2,my+1);c.lineTo(hx+w-2,my+1);c.stroke();}}
 else{c.beginPath();c.moveTo(hx-7,my);c.quadraticCurveTo(hx,my+f.smile*8,hx+7,my);c.stroke();}
 c.restore();
}
// Character drawings can be held on twos (15 per second, as in hand-drawn Flash animation); camera, shake and dust stay smooth.
const ON_TWOS=false;
function draw(t){
 const tc=ON_TWOS?Math.floor(t*15+1e-6)/15:t;
 const g=geometryAt(tc),p=g.pose;
 c.setTransform(1,0,0,1,0,0);c.fillStyle='#e9e5d9';c.fillRect(0,0,1920,1080);
 const cm=cameraAt(t).matrix,sh=shakeAt(t);c.setTransform(1,0,0,1,960+sh[0],540+sh[1]);c.rotate(sh[2]);c.transform(cm[0],cm[1],cm[2],cm[3],cm[4]-960,cm[5]-540);
 c.fillStyle='#d7d3c5';c.fillRect(-2000,830,6000,250);
 path([[-2000,830],[3000,830]],3,'#b3b5a6');
 // The stairs connect to a visibly open arch: discovery ends in an actual destination.
 c.fillStyle='#a7b7ab';c.fillRect(100,740,220,90);
 c.fillStyle='#929f91';c.beginPath();c.moveTo(95,740);c.lineTo(95,330);c.arc(195,330,100,Math.PI,0);c.lineTo(295,740);c.closePath();c.fill();
 c.fillStyle='#eed9aa';c.beginPath();c.moveTo(115,740);c.lineTo(115,330);c.arc(195,330,80,Math.PI,0);c.lineTo(275,740);c.closePath();c.fill();
 c.save();c.clip();
 c.fillStyle='#b5c2a4';c.beginPath();c.moveTo(115,560);c.lineTo(155,505);c.lineTo(195,550);c.lineTo(240,490);c.lineTo(275,535);c.lineTo(275,740);c.lineTo(115,740);c.closePath();c.fill();
 c.fillStyle='#d9c39b';c.beginPath();c.moveTo(130,740);c.lineTo(185,550);c.lineTo(205,550);c.lineTo(260,740);c.closePath();c.fill();
 c.fillStyle='#b3af95';c.fillRect(115,330,10,410);c.restore();
 c.fillStyle='#a7b7ab';c.fillRect(320,770,70,60);c.fillRect(390,800,70,30);
 c.fillStyle='#bdc7b8';c.fillRect(250,740,70,90);
 c.fillStyle='#c3bba9';c.fillRect(758,145,260,685);
 c.fillStyle='#40565a';c.fillRect(777,170,222,660);
 for(let x=790;x<998;x+=35)path([[x+g.gateOffset,205],[x+g.gateOffset,826]],9,'#91a29a');
 path([[777+g.gateOffset,530],[999+g.gateOffset,530]],14,'#b5ae92');
 c.fillStyle='#b78c4b';c.fillRect(874+g.gateOffset,514,43,46);
 // Open shackle is never drawn: the obstacle remains physically closed.
 c.strokeStyle='#b78c4b';c.lineWidth=10;c.beginPath();c.arc(895+g.gateOffset,514,12,Math.PI,0);c.stroke();
 // Dust: builds fast (~0.12 s), lingers and fades slowly (~0.9 s), shifting from pale to dull (benchmark AvA 56 s).
 for(const m of IMPACTS){const e=t-m.t;if(e>=0&&e<1.0){const grow=1-Math.pow(1-Math.min(1,e/.12),3),drift=e/1.0,fade=Math.pow(1-drift,1.6);
  for(let i=0;i<9;i++){const side=i%2?1:-1,spread=(.25+((i*37)%10)/12)*side,size=(12+((i*53)%9)*2)*(.6+1.6*grow)+drift*18;
   const shade=Math.round(200-70*drift);
   c.fillStyle=`rgba(${shade+((i*29)%14)},${shade-8+((i*17)%12)},${shade-30+((i*11)%10)},${.8*fade})`;
   c.beginPath();c.arc(m.at[0]+spread*(80*grow+50*drift),m.at[1]-8-((i*41)%5+2)*(6*grow+10*drift),size,0,Math.PI*2);c.fill();}}}
 // Character (with its contact shadows) recedes into the arch at the end.
 const d=depthAt(tc);c.save();c.translate(...DEPTH_ANCHOR);c.scale(d,d);c.translate(-DEPTH_ANCHOR[0],-DEPTH_ANCHOR[1]);
 for(const foot of p.feet){const floor=foot[0]>=115&&foot[0]<320?740:foot[0]>=320&&foot[0]<390?770:foot[0]>=390&&foot[0]<460?800:830;if(Math.abs(foot[1]-floor)<3){c.fillStyle='#b9b9a9';c.beginPath();c.ellipse(foot[0]+7,floor+3,35,6,0,0,Math.PI*2);c.fill();}}
 // Far limbs are drawn before the spine and near limbs.
 path([g.legs[0].shoulder,g.legs[0].elbow,g.legs[0].wrist],LINE-2,'#607270');
 path([g.arms[0].shoulder,g.arms[0].elbow,g.arms[0].wrist],LINE-2,'#607270');
 c.beginPath();c.moveTo(...p.hip);c.quadraticCurveTo(...g.spineControl,...p.chest);c.strokeStyle=INK;c.lineWidth=LINE+2;c.lineCap='round';c.stroke();
 // The arm roots remain close to the chest; no extra shoulder crossbar.
 path([g.legs[1].shoulder,g.legs[1].elbow,g.legs[1].wrist],LINE);
 path([g.arms[1].shoulder,g.arms[1].elbow,g.arms[1].wrist],LINE);
 g.legs.forEach((limb,i)=>path([limb.wrist,g.toeTargets[i]],LINE-3));
 c.fillStyle='#f5efdf';c.strokeStyle=INK;c.lineWidth=LINE-3;c.beginPath();c.arc(...g.head,HEAD_R,0,Math.PI*2);c.fill();c.stroke();
 drawFace(p,g.head,faceAt(tc));
 for(const a of g.arms){c.fillStyle=INK;c.beginPath();c.arc(...a.wrist,LINE*.55,0,Math.PI*2);c.fill();}
 c.restore();
 // No captions or dialogue are fabricated for this internal movement exercise.
}
window.MOTION={width:1920,height:1080,fps:30,duration:DURATION};
window.seek=window.renderAt=async(t)=>draw(t);
window.OPENER={seekFrame:window.renderAt,ready:true};
window.seek(0);
</script></html>
