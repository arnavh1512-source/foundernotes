name: Creative loop and motion proof
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s .claude/skills/podcast-scout-skill/tests -p 'test_studio_loop.py' -v
      - run: python -m unittest discover -s .claude/skills/podcast-scout-skill/tests -p 'test_review_frames.py' -v
      - run: python -m unittest discover -s .claude/skills/podcast-scout-skill/tests -p 'test_animation_backends.py' -v
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s .claude/skills/podcast-scout-skill/tests -p 'test_elevenlabs_narrate.py' -v
      - run: python -m unittest discover -s .claude/skills/podcast-scout-skill/tests -p 'test_voicestudio_narrate.py' -v
      - run: python -m unittest discover -s .claude/skills/painted-character-motion/tests -p 'test_*.py' -v
  remotion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .claude/skills/motion/remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ../tests/*.test.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npx remotion browser ensure
      - run: npm run render:proof -- proof.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: original-motion-proof
          path: .claude/skills/motion/remotion/proof.mp4

  painted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node --test .claude/skills/painted-character-motion/tests/test_engine.cjs
      - run: npm ci --prefix .claude/skills/motion --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        working-directory: .claude/skills/motion
      - name: Render original silent technical sample and frame strip
        run: |
          node .claude/skills/motion/scripts/render.mjs .claude/skills/painted-character-motion/examples/philosopher-map.html --out studio-output/painted-ci/proof.mp4 --draft
          node .claude/skills/motion/scripts/render.mjs .claude/skills/painted-character-motion/examples/philosopher-map.html --out studio-output/painted-ci/stills --stills 0,5,10,15,20.9
      - name: Verify decoded draft duration and dimensions
        run: |
          ffmpeg -v error -i studio-output/painted-ci/proof.mp4 -f null -
          python - <<'PYTHON'
          import json, subprocess
          data=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json','studio-output/painted-ci/proof.mp4']))
          video=next(s for s in data['streams'] if s['codec_type']=='video')
          assert (video['width'],video['height']) == (640,360), video
          assert abs(float(data['format']['duration'])-21)<.1, data
          assert int(video['nb_frames'])==315, video
          PYTHON
      - name: Render internal whole-body stick performance rebuild
        run: |
          node .claude/skills/motion/scripts/build-stick-performance.mjs studio-output/stick-rebuild/index.html
          node .claude/skills/motion/scripts/render.mjs studio-output/stick-rebuild/index.html --out studio-output/stick-rebuild/draft.mp4 --draft
          python .claude/skills/podcast-scout-skill/scripts/review_frames.py studio-output/stick-rebuild/draft.mp4 --out studio-output/stick-rebuild/review --times 0 1.2 2.5 3.5 4.15 4.8 5.8 7 8.3 9.4 10.4
      - uses: actions/upload-artifact@v4
        with:
          name: internal-stick-performance-rebuild
          path: studio-output/stick-rebuild/
      - uses: actions/upload-artifact@v4
        with:
          name: painted-character-technical-proof
          path: studio-output/painted-ci/
