
name: Python QC Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m py_compile .claude/skills/podcast-scout-skill/scripts/qc_video.py

      - name: Verify streaming QC structure
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path(".claude/skills/podcast-scout-skill/scripts/qc_video.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source)

          functions = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }

          assert "run_film_gate" in functions
          assert "mark_failure" in functions

          film_gate = ast.get_source_segment(
              source, functions["run_film_gate"]
          )

          assert "if not HAS_NUMPY:" in film_gate
          assert "subprocess.Popen" in film_gate
          assert "proc.stdout.read(remaining)" in film_gate
          assert "if remaining != 0:" in film_gate
          assert "if return_code != 0:" in film_gate
          assert "if n_frames < 5:" in film_gate

          assert "proc.stdout.read()" not in film_gate
          assert "raw, stderr = proc.communicate()" not in film_gate

          print("Streaming QC structure checks passed.")
          PY
