
name: Python QC Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install test dependencies
        run: |
          python -m pip install numpy

      - name: Run QC behavioral tests
        run: |
          python -m unittest discover -s tests -p "test_qc_video.py" -v

      - name: Run studio preflight, evaluation, and audio download regression tests
        run: |
          python -m unittest discover -s .claude/skills/podcast-scout-skill/tests -p "test_creative_router.py" -v
          python -m unittest discover -s .claude/skills/podcast-scout-skill/tests -p "test_lint_scenes.py" -v
          python -m unittest discover -s .claude/skills/podcast-scout-skill/tests -p "test_skill_evaluation_memory.py" -v
          python -m unittest discover -s .claude/skills/podcast-scout-skill/tests -p "test_fetch_sfx.py" -v

      - name: Test default Agent-Reach research gateway (offline mocks)
        run: |
          python -m unittest discover -s .claude/skills/podcast-scout-skill/tests -p "test_research_gateway.py" -v

      - name: Verify writing and creator marketing skill integrations
        run: |
          python -m unittest discover -s .claude/skills/podcast-scout-skill/tests -p "test_integrated_writing_marketing_skills.py" -v

      - name: Integration smoke test for scene, narration and MP4 QC
        run: |
          python -m unittest discover -s .claude/skills/podcast-scout-skill/tests -p "test_production_smoke.py" -v

      - name: Test real video decoding
        run: |
          python - <<'PY'
          import importlib.util
          import subprocess
          import tempfile
          from pathlib import Path

          script = Path(
              ".claude/skills/podcast-scout-skill/scripts/qc_video.py"
          )
          spec = importlib.util.spec_from_file_location("qc_video", script)
          qc = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(qc)

          def new_report():
              return {
                  "status": "PASS",
                  "checks": [],
                  "warnings": [],
                  "errors": [],
              }

          with tempfile.TemporaryDirectory() as directory:
              moving = str(Path(directory) / "moving.mp4")
              blank = str(Path(directory) / "blank.mp4")

              for output, source in [
                  (moving, "testsrc2=size=320x180:rate=30"),
                  (blank, "color=c=black:s=320x180:r=30"),
              ]:
                  subprocess.run([
                      "ffmpeg", "-v", "error", "-y",
                      "-f", "lavfi", "-i", source,
                      "-t", "4", "-c:v", "mpeg4", output,
                  ], check=True)

              good = new_report()
              qc.run_film_gate(moving, 4, good)

              assert good["status"] == "PASS", good
              assert any(
                  "Streamed" in check for check in good["checks"]
              ), good

              bad = new_report()
              qc.run_film_gate(blank, 4, bad)

              assert bad["status"] == "FAIL", bad
              assert any(
                  "Blank/Dead Frame" in error
                  for error in bad["errors"]
              ), bad

              print("Real video QC tests passed.")
          PY

      - name: Check Python syntax across all studio skills and tests
        run: |
          python -m compileall -q .claude/skills tests

      - name: Verify streaming QC structure
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path(".claude/skills/podcast-scout-skill/scripts/qc_video.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source)

          functions = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }

          assert "run_film_gate" in functions
          assert "mark_failure" in functions

          film_gate = ast.get_source_segment(
              source, functions["run_film_gate"]
          )

          assert "if not HAS_NUMPY:" in film_gate
          assert "subprocess.Popen" in film_gate
          assert "proc.stdout.read(remaining)" in film_gate
          assert "if remaining != 0:" in film_gate
          assert "if return_code != 0:" in film_gate
          assert "if n_frames < 5:" in film_gate

          assert "proc.stdout.read()" not in film_gate
          assert "raw, stderr = proc.communicate()" not in film_gate

          print("Streaming QC structure checks passed.")
          PY
